<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wortarten – Zuordnen</title>
  <link rel="stylesheet" href="style.css">
  <script src="exercise.js" defer></script>
</head>
<body>
  <main class="card" data-difficulty="leicht">
    <header>
      <button id="difficulty" class="level" type="button" aria-label="Schwierigkeit: Leicht. Zu Mittel wechseln.">Leicht · Zuordnen</button>
      <h1>Wortarten</h1>
    </header>
    <section aria-label="Begriffe zum Zuordnen" aria-describedby="hint" id="bank" class="bank"></section>
    <div class="diagram-scroll" tabindex="0" role="region" aria-describedby="hint" aria-label="Wortartenbaum, bei Bedarf horizontal scrollbar">
      <div id="tree" class="tree"></div>
    </div>
    <footer>
      <button id="reset" type="button" class="secondary"><svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7v5h-5"/><path d="M20 12a8 8 0 1 0-2.3 5.7M20 12a8 8 0 0 0-2.3-5.7"/></svg>Neu starten</button>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="check" type="button">Überprüfen</button>
    </footer>
    <p id="hint" class="hover-hint visually-hidden" role="tooltip">Ziehe einen Begriff in ein passendes Feld oder klicke zuerst den Begriff und dann das Feld an.</p>
    <noscript>Bitte aktiviere JavaScript, um die Begriffe zuzuordnen.</noscript>
  </main>
</body>
</html>
