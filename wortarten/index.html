<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wortarten – Zuordnen</title>
  <link rel="stylesheet" href="style.css">
  <script src="exercise.js" defer></script>
</head>
<body>
  <main class="card">
    <header>
      <p class="level">Leicht · Zuordnen</p>
      <h1>Wortarten</h1>
    </header>
    <section aria-label="Begriffe zum Zuordnen" aria-describedby="hint" title="Begriffe ziehen oder Begriff und Feld anklicken. Die Reihenfolge innerhalb einer Blattgruppe ist egal." id="bank" class="bank"></section>
    <div class="diagram-scroll" tabindex="0" role="region" aria-describedby="hint" title="Begriffe ziehen oder Begriff und Feld anklicken. Die Reihenfolge innerhalb einer Blattgruppe ist egal." aria-label="Wortartenbaum, bei Bedarf horizontal scrollbar">
      <div id="tree" class="tree"></div>
    </div>
    <footer>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="reset" type="button" class="secondary">Neu starten</button>
      <button id="check" type="button">Überprüfen</button>
    </footer>
    <p id="hint" class="visually-hidden">Begriffe ziehen oder Begriff und Feld anklicken. Die Reihenfolge innerhalb einer Blattgruppe ist egal.</p>
    <noscript>Bitte aktiviere JavaScript, um die Begriffe zuzuordnen.</noscript>
  </main>
</body>
</html>
