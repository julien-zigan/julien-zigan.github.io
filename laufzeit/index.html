      <pre tabindex="0" aria-label="Python-Code für das kartesische Produkt"><code><span data-line="1">def cart_product(a, b):</span>
<span data-line="2">    prod = []</span>
<span data-line="3">    for x in a:</span>
<span data-line="4">        for y in b:</span>
<span data-line="5">            prod.append((x, y)) # (*)</span>
<span data-line="6">    return prod</span></code></pre>
